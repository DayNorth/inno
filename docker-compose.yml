services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vinkaplant-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Definir DB_SA_PASSWORD en .env}
    ports:
      - "${DB_HOST_PORT:-1434}:1433"
    volumes:
      - vinkaplant_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  vinkaplant_sql_data:
