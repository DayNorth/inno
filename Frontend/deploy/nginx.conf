# Ejemplo de host estatico para la SPA de VinkaPlant.
#
# `frame-ancestors` y `X-Frame-Options` NO funcionan en un <meta>: tienen que
# ser headers HTTP reales. Por eso la CSP estricta vive aqui y no en index.html.
# Si la SPA se sirve desde el propio Express, la equivalencia se configura con
# `helmet`, que ya es dependencia del backend.

server {
  listen 443 ssl http2;
  server_name vinkaplant.example;

  root /var/www/vinkaplant/client;   # salida de `npm run build` (build/client)
  index index.html;

  # --- Contencion de XSS (frontend-seguridad.md §3.1) -----------------------
  # `style-src 'self'` SIN 'unsafe-inline' es alcanzable porque todo el estilo
  # va en CSS Modules y el lint prohibe `style={{}}`.
  # Sustituir <host-api> por el origen exacto del backend: es el control que
  # impide que un script inyectado exfiltre datos a un tercero.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://<host-api>; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  # --- Trusted Types: DESPLIEGUE EN DOS PASOS (§3.2) ------------------------
  # Paso 1 (activo): modo reporte. No bloquea nada.
  # Paso 2 (tras una ventana sin violaciones): mover estas dos directivas al
  # header `Content-Security-Policy` de arriba y borrar esta linea.
  add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default; report-uri /csp-report" always;

  # --- Complementarios ------------------------------------------------------
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Los assets llevan hash de contenido: se pueden cachear indefinidamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # El documento nunca se cachea: si no, un despliegue no llega al navegador.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  # SPA: cualquier ruta desconocida la resuelve el router en el cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
